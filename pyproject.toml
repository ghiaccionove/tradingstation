[project]
name = "tradingstation"
version = "0.1.0"
description = ""
authors = [{ name = "ghiaccionove", email = "ant.cito@gmail.com" }]
readme = "README.md"
# la wheel di TA-Lib in libs/ funziona solo con Python 3.10
requires-python = "==3.10.*"
dependencies = [
    "pandas>=2.2.2,<3",
    "ccxt>=4.3.42,<5",
    "ta-lib",
    "numpy>=1.26.4,<2",
    "prompt-toolkit>=3.0.51,<4",
    "requests>=2.34.2,<3",
]

[tool.uv]
# non è un pacchetto da pubblicare, solo un'applicazione
package = false

[tool.uv.sources]
ta-lib = { path = "libs/TA_Lib-0.4.24-cp310-cp310-win_amd64.whl" }
